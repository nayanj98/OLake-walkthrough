# Trino query layer for Iceberg tables already running on olake-network.
#
# Prerequisites (must be running first):
#   1. docker compose -f docker-compose-v1.yml up -d
#   2. docker compose -f olake/examples/spark-tablurarest-minio-mysql/docker-compose.yml up -d
#
# This compose file only starts Trino (+ optional SQLPad). It reuses the existing
# MinIO (minio:9000) and Iceberg REST catalog (iceberg-rest:8181) from the Spark stack.

services:
  trino:
    image: trinodb/trino:latest
    container_name: olake-trino-coordinator
    ports:
      - "8090:8080"
    volumes:
      - ./trino/etc:/etc/trino:ro
      - ./trino/trino-data:/var/lib/trino
    networks:
      - olake-network
    restart: unless-stopped

  sqlpad:
    image: sqlpad/sqlpad:latest
    container_name: sqlpad-trino
    ports:
      - "3000:3000"
    environment:
      SQLPAD_ADMIN: admin
      SQLPAD_ADMIN_PASSWORD: password
      SQLPAD_CONNECTIONS__olake__name: OLake Demo
      SQLPAD_CONNECTIONS__olake__driver: trino
      SQLPAD_CONNECTIONS__olake__host: host.docker.internal
      SQLPAD_CONNECTIONS__olake__port: 8090
      SQLPAD_CONNECTIONS__olake__username: admin
      SQLPAD_CONNECTIONS__olake__catalog: iceberg
      SQLPAD_CONNECTIONS__olake__schema: job_weather
    networks:
      - olake-network
    depends_on:
      - trino
    restart: unless-stopped

networks:
  olake-network:
    external: true
